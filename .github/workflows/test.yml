name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN. Every job in this workflow only reads the
# repository -- checkout, dependency install, lint/test and artifact upload all
# work fine with `contents: read`. A job that ever needs to write (push a commit,
# comment on a PR, cut a release) must request that scope on itself rather than
# widening this block.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarCloud needs the full history to attribute code to authors and
          # to work out what counts as "new code"; a shallow clone breaks both.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # `--only-binary :all:` makes pip refuse source distributions, so no
      # package's setup.py can execute during install. Checked against the
      # resolved tree for cp313/manylinux: all 81 distributions have wheels,
      # so this constrains what pip may do without changing what it installs.
      #
      # `python -m pip install --upgrade pip` used to lead this block. It was a
      # no-op -- setup-python already provides the current pip -- and pinning it
      # to satisfy the version-lock rule would turn it into a downgrade the day
      # the runner image ships something newer, so the line is gone instead.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt --only-binary :all:
          # Test-only; requirements.txt stays the pinned runtime set. Pinned to
          # the version CI already resolved, so behaviour is unchanged.
          pip install pytest-cov==7.1.0 --only-binary :all:

      - name: Run pytest
        env:
          # Tests stub external services; these are present so module-level
          # client constructions don't fail at import time.
          OPENAI_API_KEY: test-openai-key
          VOYAGE_API_KEY: test-voyage-key
        # Measures every path named in sonar.sources (core, app.py, cli.py).
        # SonarCloud scores a declared source file that is absent from
        # coverage.xml as 0% covered rather than as unmeasured, so --cov=core
        # alone reported app.py as 0/110 even though tests/test_app_query_errors.py
        # and tests/test_app_repos_errors.py drive its error handlers directly.
        # cli.py has no tests yet and so is still absent from the report; it is
        # named here so it is measured the moment one imports it.
        run: pytest -v --cov=core --cov=app --cov=cli --cov-report=xml --cov-report=term

      - name: Coverage summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
          print("## Coverage")
          print()
          print(f"**{rate * 100:.2f}%** of statements in `core/`, `app.py` and `cli.py` covered.")
          EOF

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

      # Runs after pytest so coverage.xml already exists. Configuration lives in
      # sonar-project.properties at the repo root.
      #
      # Analysis is advisory, not a gate: continue-on-error keeps a SonarCloud
      # outage or a scanner hiccup from failing the required check.
      - name: SonarCloud analysis
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # Pinned to the version CI already resolved; see the install step above
      # for why `--only-binary :all:` is here.
      - name: Install ruff
        # Quoted: a plain YAML scalar may not end in a colon.
        run: "pip install ruff==0.16.5 --only-binary :all:"

      - name: Run ruff
        run: ruff check .
