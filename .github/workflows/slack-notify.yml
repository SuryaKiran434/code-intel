name: Slack Push Notification

on:
  push:
    branches:
      - '**'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Pull the commit metadata in through the env so the shell never
          # interpolates user-controlled text. Direct `${{ ... }}` expansion
          # inside a `run:` script is a code-injection vector — backticks /
          # `$(...)` in a commit message would otherwise execute on the
          # runner. See: https://securitylab.github.com/research/github-actions-untrusted-input/
          COMMIT_MSG:  ${{ github.event.head_commit.message }}
          BRANCH:      ${{ github.ref_name }}
          AUTHOR:      ${{ github.event.head_commit.author.name }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            COLOR="#36a64f"
          else
            COLOR="#f0a500"
          fi

          # Build the payload with jq so it handles JSON escaping for us —
          # commit messages may contain quotes, backslashes, newlines, etc.
          PAYLOAD=$(jq -n \
            --arg branch  "$BRANCH" \
            --arg author  "$AUTHOR" \
            --arg message "$COMMIT_MSG" \
            --arg color   "$COLOR" \
            '{
              username:   "GitHub Bot",
              icon_emoji: ":rocket:",
              text:       ("🚀 *New push to code-intel* — `" + $branch + "`"),
              attachments: [
                {
                  color: $color,
                  fields: [
                    { title: "🌿 Branch",  value: ("`" + $branch + "`"), short: true  },
                    { title: "👤 Author",  value: $author,               short: true  },
                    { title: "💬 Message", value: $message,              short: false }
                  ]
                }
              ]
            }')

          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
