# SonarCloud configuration for CI-based analysis.
#
# Automatic Analysis is switched off for this project: it cannot import test
# coverage. The scan is run from .github/workflows/test.yml, after pytest has
# written coverage.xml.

sonar.projectKey=SuryaKiran434_code-intel
sonar.organization=suryakiran434

# `core` is the application package; app.py and cli.py are the two entrypoints
# that sit on top of it. Everything under tests/ is test code.
sonar.sources=core,app.py,cli.py
sonar.tests=tests

# pytest is invoked with --cov=core --cov-report=xml, which writes coverage.xml
# to the repository root.
sonar.python.coverage.reportPaths=coverage.xml

# Never analysis targets: vendored/installed dependencies and the test suite
# (the latter is declared above as tests, not sources).
sonar.exclusions=**/venv/**,**/.venv/**,**/node_modules/**,tests/**

sonar.python.version=3.13
sonar.sourceEncoding=UTF-8
